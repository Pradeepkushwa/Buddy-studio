name: CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Rails Backend Tests
  # ─────────────────────────────────────────────
  backend:
    name: Backend Tests (RSpec)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      RAILS_ENV: test
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      ADMIN_EMAIL: admin@test.com
      ADMIN_PASSWORD: TestPassword123!

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: backend/.ruby-version
          bundler-cache: true
          working-directory: backend

      - name: Set up test database
        run: bundle exec rails db:create db:migrate

      - name: Run RSpec
        run: bundle exec rspec --format progress
        env:
          FULL_COVERAGE_CHECK: 'true'

  # ─────────────────────────────────────────────
  # Job 2: Buddy Agent (Python FastAPI) Tests
  # ─────────────────────────────────────────────
  buddy-agent:
    name: Buddy Agent Tests (pytest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: buddy-agent

    env:
      LLM_PROVIDER: none
      SUPPORT_PHONE: "+91-XXXXXXXXXX"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: buddy-agent/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run pytest
        run: pytest tests/ -q

  # ─────────────────────────────────────────────
  # Job 3: React Frontend Tests + Build
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend Tests (Jest) + Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Build for production
        run: npm run build
        env:
          CI: false

  # ─────────────────────────────────────────────
  # Job 4: Deploy to Render (only on main branch)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [backend, frontend, buddy-agent]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy Hook (backend/frontend)
        run: |
          curl --fail-with-body \
            -X POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Trigger Buddy Agent Deploy Hook
        env:
          BUDDY_AGENT_DEPLOY_HOOK: ${{ secrets.RENDER_BUDDY_AGENT_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$BUDDY_AGENT_DEPLOY_HOOK" ]; then
            curl --fail-with-body -X POST "$BUDDY_AGENT_DEPLOY_HOOK"
          else
            echo "RENDER_BUDDY_AGENT_DEPLOY_HOOK_URL not set — skip agent deploy hook"
          fi
