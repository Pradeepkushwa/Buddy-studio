name: CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Rails Backend Tests
  # ─────────────────────────────────────────────
  backend:
    name: Backend Tests (RSpec)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      RAILS_ENV: test
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      ADMIN_EMAIL: admin@test.com
      ADMIN_PASSWORD: TestPassword123!

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: backend/.ruby-version
          bundler-cache: true
          working-directory: backend

      - name: Set up test database
        run: bundle exec rails db:create db:migrate

      - name: Run RSpec
        run: bundle exec rspec --format progress
        env:
          FULL_COVERAGE_CHECK: 'true'

  # ─────────────────────────────────────────────
  # Job 2: React Frontend Tests + Build
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend Tests (Jest) + Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Build for production
        run: npm run build
        env:
          CI: false

  # ─────────────────────────────────────────────
  # Job 3: Deploy to Render (only on main branch)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl --fail-with-body \
            -X POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        continue-on-error: false
