# ── LOCAL DEVELOPMENT ONLY ─────────────────────────────────────────────────────
# Run all 3 services with one command: docker-compose up
#
# Prerequisites:
#   1. Install Docker Desktop: https://www.docker.com/products/docker-desktop/
#   2. cp .env.docker.example .env.docker
#   3. Fill in GEMINI_API_KEY and SUPPORT_PHONE in .env.docker
#
# Then:
#   docker-compose up            # start all services
#   docker-compose up --build    # rebuild images (after code changes)
#   docker-compose down          # stop all services
# ───────────────────────────────────────────────────────────────────────────────

services:

  # ── Python FastAPI Agent ────────────────────────────────────────────────────
  buddy-agent:
    build:
      context: ./buddy-agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000
    volumes:
      # Live reload: code changes reflect without rebuild
      - ./buddy-agent/app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Rails Backend API ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - .env.docker
    environment:
      - RAILS_ENV=development
    volumes:
      # Persist SQLite database between restarts
      - ./backend/db:/app/db
      # Live reload: code changes reflect without rebuild
      - ./backend/app:/app/app
    restart: unless-stopped

  # ── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      - REACT_APP_API_URL=http://localhost:3001
      - REACT_APP_AGENT_URL=http://localhost:8000
    volumes:
      # Live reload: code changes reflect without rebuild
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
      - buddy-agent
    stdin_open: true
    restart: unless-stopped
